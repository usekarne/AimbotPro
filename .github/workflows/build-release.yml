name: Build Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            AimbotPro/AimbotProV3/.gradle
          key: gradle-${{ hashFiles('AimbotPro/AimbotProV3/**/*.gradle*', 'AimbotPro/AimbotProV3/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p AimbotPro/AimbotProV3/keystore
          printf '%s' "$KS_B64" | base64 -d > AimbotPro/AimbotProV3/keystore/release.jks
          chmod 600 AimbotPro/AimbotProV3/keystore/release.jks
          file AimbotPro/AimbotProV3/keystore/release.jks
          ls -lh AimbotPro/AimbotProV3/keystore/release.jks

      - name: Build Release APK
        working-directory: AimbotPro/AimbotProV3
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-sdk-path || '/usr/local/lib/android/sdk' }}
          AIMBOT_KEYSTORE_FILE: keystore/release.jks
          AIMBOT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AIMBOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AIMBOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain -PbuildHash=${{ github.sha }}

      - name: Sign verification
        working-directory: AimbotPro/AimbotProV3
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          echo "Built: $APK ($(stat -c%s "$APK") bytes)"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner verify --print-certs "$APK" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimbotPro-v4.1.0-release-signed
          path: AimbotPro/AimbotProV3/${{ env.APK }}
          retention-days: 7
          if-no-files-found: error
