# JVM — same config as the v2 build that succeeded (4GB heap)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.unsafe.configuration-cache=true

# AndroidX
android.useAndroidX=true
# Jetifier disabled in v4 — all dependencies are already AndroidX, so
# the jetifier pass just slows the build down without producing any benefit.
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.nonFinalResIds=false
android.suppressUnsupportedCompileSdk=34
